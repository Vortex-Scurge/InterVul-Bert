[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "intervul-graph"
version = "0.1.0"
description = "Interprocedural Context for Transformer-Based Vulnerability Detection"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "InterVul-Graph Research Team" }
]
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.36.0",
    "tree-sitter>=0.21.3",
    "tree-sitter-c>=0.21.0",
    "tree-sitter-cpp>=0.21.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "networkx>=3.0",
    "pyyaml>=6.0",
    "tabulate>=0.9.0",
    "jinja2>=3.1.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "flask>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
    "black>=24.0.0",
]

[tool.setuptools]
packages = [
    "src",
    "src.data",
    "src.preprocessing",
    "src.models",
    "src.training",
    "src.evaluation",
    "src.callgraph",
    "src.interprocedural",
    "src.visualization",
    "src.analysis",
    "src.utils",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = ["BLE001", "B008", "C401", "SIM115", "UP007", "UP035"]

[tool.black]
line-length = 100
target-version = ['py311']
