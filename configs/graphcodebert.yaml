model:
  name: "graphcodebert"
  pretrained_model: "microsoft/graphcodebert-base"
  finetuned_checkpoint: "microsoft/graphcodebert-base"
  max_length: 512
  num_labels: 2
  hidden_dropout_prob: 0.1
  save_dir: "models/graphcodebert"

data:
  dataset_name: "diversevul"
  test_split: "data/processed/test_samples.jsonl"
  max_test_samples: 500

evaluation:
  results_dir: "results/interprocedural"
  contexts:
    - "local"
    - "caller"
    - "callee"
    - "full"
    - "multihop"
