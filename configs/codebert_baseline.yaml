model:
  name: "codebert"
  pretrained_model: "microsoft/codebert-base"
  max_length: 512
  num_labels: 2
  hidden_dropout_prob: 0.1
  save_dir: "models/codebert"

data:
  dataset_name: "diversevul"
  raw_path: "data/raw/diversevul/diversevul_20230702.json"
  metadata_path: "data/raw/diversevul/diversevul_20230702_metadata.json"
  processed_dir: "data/processed"
  train_split: "data/processed/train_samples.jsonl"
  val_split: "data/processed/val_samples.jsonl"
  test_split: "data/processed/test_samples.jsonl"
  leakage_report: "data/processed/leakage_report.json"
  max_train_samples: 1500
  max_val_samples: 300
  max_test_samples: 300
  split_strategy: "project_aware"

training:
  seed: 42
  batch_size: 4
  learning_rate: 2.0e-5
  weight_decay: 0.01
  num_epochs: 2
  warmup_ratio: 0.1
  fp16: true
  gradient_accumulation_steps: 1
  evaluation_strategy: "epoch"
  save_strategy: "epoch"
  metric_for_best_model: "f1"

evaluation:
  results_dir: "results/baseline"
  metrics: ["accuracy", "precision", "recall", "f1", "roc_auc", "pr_auc"]
